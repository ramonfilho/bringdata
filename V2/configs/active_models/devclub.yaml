active_model:
  model_name: v1_devclub_rf_temporal_leads_single_abr28
  mlflow_run_id: 5d158f0aa6e54b489498470446194a6c
  trained_at: '2026-04-28T00:00:00'
  split_method: temporal_leads
  performance:
    auc: 0.6999
    monotonia_percentage: 88.89
    lift_maximum: 3.88
  # Champion = abr28 (promovido 25/07/2026, aposentando o jan30). O abr28 pontua todo
  # lead SEM tag (o pega-tudo/fallback via este active_model) e continua servindo as
  # campanhas LEADHQLB (bloco challenger_abr28 abaixo, que dispara HQLB no pixel 1513).
  # jan30 REMOVIDO: nenhuma campanha ativa otimizava pro evento dele e ele pontuava
  # ~30% dos leads à toa (investigação 25/07/2026). Novo challenger = jul_24.

# Para mudar o modelo ativo:
# 1. Treine um novo modelo: python -m src.train_pipeline --set-active
# 2. Ative um run existente: python -m src.train_pipeline --activate-run <run_id>

# =============================================================================
# A/B test — Champion abr28 (pega-tudo) vs Challenger jul_24 (tag "jul_24")
# =============================================================================
# Roteamento (substring case-insensitive, ver src/core/client_config.py:match_variant):
# Cada campo do utm_pattern carrega uma LISTA e basta UMA substring casar.
#   - utm_campaign contendo "LEADHQLB" ou "ABR_28_TOP30" → Champion abr28
#   - utm_campaign contendo "JUL24"    ou "JUL_24"       → Challenger jul_24
#   - qualquer outro UTM/URL                             → default/fallback = active_model (abr28)
#
# DUAS GERAÇÕES DE CAMPANHA CONVIVEM (09/08/2026). O gestor subiu uma estrutura nova no
# pixel NOVO (1349518197389751, "DEVLF - NOVO") enquanto a antiga seguia gastando:
#   geração antiga: "DEVLF | CAP | FRIO | ... | JUL24_TOP30"          → pixel 1513, evento jul_24_top30
#   geração nova:   "[14][DEVLF][CAP]...[PIXELNOVO][JUL_24_TOP30]"    → pixel 1349, evento jul_24_top30
# A etiqueta chega no utm_campaign porque as ads usam url_tags
# `utm_campaign={{campaign.name}}|{{campaign.id}}` — o nome INTEIRO da campanha vira UTM.
# Atenção ao underline: "JUL24" NÃO casa "JUL_24_TOP30". Ligar só a etiqueta nova
# desligaria a antiga no mesmo commit, e os leads dela cairiam calados no fallback.
#
# Eventos Meta:
#   - Fallback/pega-tudo (abr28, lead sem tag): eventos default do bloco `capi:` do cliente
#     (LeadQualified/LeadQualifiedHighQuality, pixel 1937) — ignorados pelas campanhas.
#   - abr28: HQLB_LQ (base, value=0, ignorado) + HQLB (D8-D10, pixel 1513)
#     + abr_28_top30 (D8-D10, pixel 1349) — este é o que a campanha [13] otimiza.
#   - jul_24: jul_24_lq (base, ignorado como o HQLB_LQ) + jul_24_top30 (D8-D10)
#     + top10/top50/70-90/50-70 no pixel 1513, e top30/top50 espelhados no pixel 1349
#     — que é o que as campanhas [14] e [15] otimizam.
#   Evento novo se cria no Meta via test event (mesmo método do HQLB, 29/04/2026, TEST25625).
# =============================================================================
ab_test:
  enabled: true
  variants:
    # =============================================================================
    # abr28 — CHAMPION (venceu o A/B, virou produção). Serve as campanhas LEADHQLB
    # (HQLB no pixel 1513) e, como active_model, pontua todo o tráfego sem tag.
    # Sem encoding_overrides: abr28 usa o encoding PADRÃO (idade/salário em one-hot).
    # (o jan30 é que precisava de ordinal — bloco removido na aposentadoria.)
    # =============================================================================
    challenger_abr28:
      run_id: 5d158f0aa6e54b489498470446194a6c
      role: champion                             # papel ATUAL (promovido 25/07/2026)
      # Papel ao longo do tempo — fonte única da datação (core/ab_arm.role_at).
      # Relatório histórico precisa saber que em junho este modelo era o CHALLENGER;
      # sem isto, promover um modelo reescreve o passado de todos os relatórios.
      # `from` é inclusivo. Evidência das datas: evento HQLB criado 29/04/2026 (test
      # event TEST25625); promoção a champion documentada em 25/07/2026.
      role_history:
        - {role: challenger, from: 2026-04-29}
        - {role: champion,   from: 2026-07-25}
      campaign_tag: "HQLB"                        # substring p/ classificador (cobre LEADHQLB/HQLB/HQLB_LQ)
      display_name: "Champion (abr_28)"
      # Duas gerações de campanha convivem, por isso a LISTA (basta uma substring casar):
      #   - "LEADHQLB": geração antiga, "DEVLF | CAP | ... | LEADHQLB" (pixel 1513, evento HQLB).
      #   - "ABR_28_TOP30": geração de 09/08/2026, "[13][DEVLF][CAP]...[PIXELNOVO][ABR_28_TOP30]"
      #     (pixel 1349…, evento abr_28_top30). A etiqueta vem no utm_campaign porque as ads
      #     usam url_tags `utm_campaign={{campaign.name}}|{{campaign.id}}`.
      # Sem a lista, ligar a etiqueta nova desligaria a antiga no mesmo commit e os leads dela
      # cairiam calados no fallback (eventos padrão, pixel errado).
      utm_pattern:
        utm_campaign: ["LEADHQLB", "ABR_28_TOP30"]
      url_pattern: "ml-parabens-psq-devf"        # OR com utm_pattern — redundância (URL pós-form)
      pixel_id_override: "1513132406527995"      # HQLB cadastrado neste pixel
      capi_event_name: HQLB_LQ
      capi_event_name_high_quality: HQLB
      capi_high_quality_decils: ['D08', 'D09', 'D10']   # D8 entra (lift ≈ D9); D7 é baseline
      # Espelho do top 30 no pixel NOVO (1349518197389751, "DEVLF - NOVO", criado 08/08/2026).
      # Mesma faixa do HQLB primário (D8-D10 = top 30%), nome explícito pra ficar comparável
      # lado a lado com o jul_24_top30 no MESMO pixel — que é o objetivo do pixel novo.
      # NÃO mexe no HQLB do 1513: o primário segue igual e as campanhas atuais não sentem nada.
      # Rollback = deletar este bloco (a lista vira None e o laço de fan-out fica inerte).
      capi_secondary_hq_events:
        - event_name: abr_28_top30            # top 30% do Champion abr_28 (= faixa do HQLB)
          pixel_id: "1349518197389751"
          decils: ['D08', 'D09', 'D10']
      conversion_rates:                          # back-calculado de LEAD_VALUE_BY_DECILE ÷ 1563.75
        D01: 0.000454   # 0.71 / 1563.75
        D02: 0.001816   # 2.84 / 1563.75
        D03: 0.001816   # 2.84 / 1563.75
        D04: 0.003076   # 4.81 / 1563.75
        D05: 0.003076   # 4.81 / 1563.75
        D06: 0.004918   # 7.69 / 1563.75
        D07: 0.005896   # 9.22 / 1563.75
        D08: 0.007635   # 11.94 / 1563.75
        D09: 0.007635   # 11.94 / 1563.75
        D10: 0.013231   # 20.69 / 1563.75
      conversion_rate_benchmark:                 # pro revenue_forecast ML-aware
        periodo_referencia: "Champion x lift (re-bin parquet jan30 vs abr28, LF43-48)"
        D1_D5: 0.0041
        D6_D9: 0.0069
        D10:   0.0143

    # =============================================================================
    # jul_24 — CHALLENGER NOVO. Retreino limpo (feature selection + peso de controle ON,
    # lineage git 135b219). Roteia pelo próprio nome ("jul_24"). Vários eventos de qualidade
    # no MESMO pixel do abr28 (1513) pra o tráfego testar cortes diferentes:
    #   Primário:   jul_24_top30 (D8-D10, top 30%).
    #   Secundários (via capi_secondary_hq_events):
    #     - agregados (topo, cumulativos): jul_24_top10 (D10), jul_24_top50 (D6-D10).
    #     - isolados (faixa de percentil):  jul_24_70-90 (D8-D9), jul_24_50-70 (D6-D7).
    # Nomenclatura: agregado leva "top", isolado é a faixa de percentil pura.
    # Sem encoding_overrides (encoding padrão, igual ao abr28). conversion_rates reusa a
    # régua do abr28 — o evento base (jul_24_lq) é ignorado pelo Meta (não cadastrado,
    # como o HQLB_LQ); quem otimiza são os eventos de qualidade (ocorrência, não valor).
    # =============================================================================
    challenger_jul_24:
      run_id: b085b63681bc4d0d90bdbd466106763a
      role: challenger
      # Papel ao longo do tempo (ver explicação no bloco do abr28). Data evidenciada em
      # DOIS lugares independentes: 1º gasto das campanhas JUL24 em analytics.ad_spend e
      # 1º lead com variant='challenger_jul_24' no ledger, ambos em 2026-07-29.
      role_history:
        - {role: challenger, from: 2026-07-29}
      # As campanhas na Meta se chamam "JUL24_TOP30/TOP10/TOP50" (sem underline antes do 24).
      # A etiqueta ERA "jul_24" e nunca casava (substring) → leads caíam em variant=None e
      # recebiam os eventos padrão, não os do jul_24 (A/B parado). "JUL24" casa os 3 tiers.
      campaign_tag: "JUL24"                     # classificador do relatório (mesmo typo)
      display_name: "Challenger (jul_24)"
      # Duas gerações de campanha convivem, por isso a LISTA (basta uma substring casar):
      #   - "JUL24":  geração antiga, "DEVLF | CAP | ... | JUL24_TOP30/TOP10/TOP50" (pixel 1513).
      #   - "JUL_24": geração de 09/08/2026, "[14]...[PIXELNOVO][JUL_24_TOP30]" e
      #     "[15]...[JUL_24_TOP50]" (pixel 1349…). COM underline — "JUL24" NÃO casa "JUL_24".
      # As duas substrings são necessárias: uma não é prefixo da outra.
      utm_pattern:
        utm_campaign: ["JUL24", "JUL_24"]
      pixel_id_override: "1513132406527995"
      capi_event_name: jul_24_lq
      capi_event_name_high_quality: jul_24_top30
      capi_high_quality_decils: ['D08', 'D09', 'D10']
      capi_secondary_hq_events:
        - event_name: jul_24_top10          # agregado: top 10% (a nata)
          pixel_id: "1513132406527995"
          decils: ['D10']
        - event_name: jul_24_top50          # agregado: top 50% (~baseline, D6-D10)
          pixel_id: "1513132406527995"
          decils: ['D06', 'D07', 'D08', 'D09', 'D10']
        - event_name: "jul_24_70-90"        # isolado: percentil 70-90 (D8-D9)
          pixel_id: "1513132406527995"
          decils: ['D08', 'D09']
        - event_name: "jul_24_50-70"        # isolado: percentil 50-70 (D6-D7)
          pixel_id: "1513132406527995"
          decils: ['D06', 'D07']
        # Espelhos no pixel NOVO (1349518197389751, "DEVLF - NOVO", criado 08/08/2026).
        # Mesmos nomes e mesmas faixas dos que já saem no 1513 — o que muda é só o destino.
        # Meta deduplica por (pixel, nome do evento, event_id), então nome repetido em pixel
        # diferente não colide. O 1513 segue recebendo tudo; isto só ADICIONA destino.
        - event_name: jul_24_top30          # top 30% do Challenger jul_24 (= faixa do HQ primário)
          pixel_id: "1349518197389751"
          decils: ['D08', 'D09', 'D10']
        - event_name: jul_24_top50          # top 50% do Challenger jul_24 (D6-D10)
          pixel_id: "1349518197389751"
          decils: ['D06', 'D07', 'D08', 'D09', 'D10']
      conversion_rates:
        D01: 0.000454
        D02: 0.001816
        D03: 0.001816
        D04: 0.003076
        D05: 0.003076
        D06: 0.004918
        D07: 0.005896
        D08: 0.007635
        D09: 0.007635
        D10: 0.013231
