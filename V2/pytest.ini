# Configuração da suíte. Antes disto cada arquivo de teste ajustava o sys.path na mão e
# a suíte só rodava se alguém lembrasse de rodar (259 PRs mergeados sem nenhum check).
# `pythonpath = .` faz `src`, `api` e `scripts` importáveis a partir de V2/.
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
