  PAINEL-DADOS: template declarativo reutilizável.
  Para um painel novo: NÃO reescreva o runtime. Só edite o objeto SPEC lá embaixo
  e publique este arquivo com a ferramenta Artifact.

  SPEC = {
    eyebrow, title, subtitle(html), source,
    tiles: [{color, label, value, note}],
    sections: [
      { title, sub, chart: {                       // gráfico de barras (1 série)
          type:'bars', unit:'%'|'R$'|'', dec, color:'accent'|'c1'|'#hex',
          data:[{label, mean, std?, partial?}] } },
      { title, sub, chart: {                        // barras agrupadas (N séries)
          type:'grouped', unit, dec,
          series:[{name, color}],                   // 2-3; cores c1/c2/c3
          groups:[{label, values:[{mean,std?}], partial?}] } },
      { title, sub, chart: {                        // linha (série temporal / ordinal)
          type:'line', unit, dec,
          xlabels:[...], series:[{name, color, points:[num,...]}] } },
      { title, sub, chart: {                        // tabela-mapa (heatmap por bucket)
          type:'heat', unit, dec, cols:[...],
          rows:[{label, values:[num,...]}],
          buckets:[{lt:8,cls:'s'},{lt:20,cls:'m'},{cls:'v'}] } },  // s=verde m=amarelo v=vermelho
      { title, sub, html:'<p>...</p>' }             // seção de prosa livre
    ],
    footer
  }
  Regras: 1 eixo por gráfico; hues categóricas em ordem fixa (c1,c2,c3), nunca cicladas;
  legenda quando >=2 séries; hastes = ±1 desvio (passe std) pra mostrar estabilidade;
  cores já validadas (CVD) em light e dark. Para 4+ séries, rode o validador do /dataviz.
-->

}
function grouped(host,ch){
  const mx=Math.max(...ch.groups.flatMap(g=>g.values.map(v=>v.mean+(v.std||0))));const{ym,y0,t}=scale(mx);const s=svg(W,H);const y=axis(s,ym,t,ch,y0);
  const n=ch.series.length,slot=PW/ch.groups.length,bw=Math.min(24,slot*0.7/n),gap=3,span=n*bw+(n-1)*gap;
  ch.groups.forEach((g,i)=>{const gc=M.l+slot*(i+.5);
    g.values.forEach((v,j)=>{const cx=gc-span/2+bw/2+j*(bw+gap);
      const r=A(s,"rect",{x:cx-bw/2,y:y(v.mean),width:bw,height:Math.max(0,M.t+PH-y(v.mean)),rx:4,class:"bar"+(g.partial?" part":""),style:`fill:${col(ch.series[j].color)}`});
      hov(r,`<b>${g.label}</b> · ${ch.series[j].name} ${fmt(v.mean,ch)}${v.std!=null?` · σ ±${v.std}`:""}`);
      if(v.std!=null)whisker(s,cx,y(v.mean+v.std),y(Math.max(0,v.mean-v.std)),5);
      T(s,cx,y(v.mean+(v.std||0))-6,"vlab",fmt(v.mean,ch));});
    T(s,gc,H-M.b+20,"xlab"+(g.partial?" part":""),g.label);});
  host.appendChild(s);
}
function line(host,ch){
  const all=ch.series.flatMap(se=>se.points);const{ym,y0,t}=scale(Math.max(...all));const s=svg(W,H);const y=axis(s,ym,t,ch,y0);
  const n=ch.xlabels.length,step=PW/(n-1||1),x=i=>M.l+step*i;
  ch.series.forEach(se=>{const c=col(se.color);
    let dpath=se.points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p)).join(" ");
    A(s,"path",{d:dpath,fill:"none",style:`stroke:${c}`,"stroke-width":2.2,"stroke-linejoin":"round","stroke-linecap":"round"});
    se.points.forEach((p,i)=>{const m=A(s,"circle",{cx:x(i),cy:y(p),r:4,class:"mk",style:`fill:${c}`});hov(m,`<b>${ch.xlabels[i]}</b> · ${se.name}: ${fmt(p,ch)}`);});});
  ch.xlabels.forEach((l,i)=>T(s,x(i),H-M.b+20,"xlab",l));
  host.appendChild(s);
}
function heat(host,ch){
  const tb=el("table"),th=el("thead"),tr=el("tr");tr.appendChild(el("th","metric","Métrica"));
  ch.cols.forEach(c=>{const e=el("th",null,c);tr.appendChild(e);});th.appendChild(tr);tb.appendChild(th);
  const bd=el("tbody");
  ch.rows.forEach(r=>{const t=el("tr");const m=el("td","metric",r.label);t.appendChild(m);
    r.values.forEach(v=>{const b=ch.buckets.find(bk=>bk.lt==null||v<bk.lt)||ch.buckets[ch.buckets.length-1];
      const td=el("td",null,`<span class="chip cv-${b.cls}">${fmt(v,ch)}</span>`);t.appendChild(td);});
    bd.appendChild(t);});
  tb.appendChild(bd);host.appendChild(tb);
}

function build(){
  const app=document.getElementById("app");
  if(SPEC.eyebrow)app.appendChild(el("p","eyebrow",SPEC.eyebrow));
  app.appendChild(el("h1",null,SPEC.title));
  if(SPEC.subtitle)app.appendChild(el("p","sub",SPEC.subtitle));
  if(SPEC.source)app.appendChild(el("p","sub src",SPEC.source));
  if(SPEC.tiles?.length){const g=el("div","tiles");SPEC.tiles.forEach(t=>{
    const d=el("div","tile");d.innerHTML=`<div class="lab"><span class="dot" style="background:${col(t.color)}"></span>${t.label}</div><div class="val"${t.value&&/vol|instáv|crít/i.test(t.value)?' style="color:var(--v)"':''}>${t.value}</div>${t.note?`<div class="note">${t.note}</div>`:""}`;g.appendChild(d);});app.appendChild(g);}
  SPEC.sections.forEach(sec=>{const s=el("section");s.appendChild(el("h2",null,sec.title));if(sec.sub)s.appendChild(el("p","h2sub",sec.sub));
    const ch=sec.chart;
    if(ch){
      if(ch.type==="grouped"||(ch.type==="line"&&ch.series.length>1)){const lg=el("div","legend");ch.series.forEach(se=>lg.innerHTML+=`<span><span class="dot" style="background:${col(se.color)}"></span>${se.name}</span>`);if(ch.type==="grouped"&&ch.groups.some(g=>g.values.some(v=>v.std!=null)))lg.innerHTML+='<span style="color:var(--faint)">haste = ±1 desvio</span>';s.appendChild(lg);}
      const card=el("div","card");s.appendChild(card);
      ({bars,grouped,line,heat}[ch.type]||(()=>{}))(card,ch);}
    if(sec.html){const p=el("div","prose",sec.html);s.appendChild(p);}
    app.appendChild(s);});
  if(SPEC.footer)app.appendChild(el("p","foot",SPEC.footer));
}
build();
</script>
