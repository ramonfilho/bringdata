  PAINEL-DADOS: template declarativo reutilizável.
  Para um painel novo: NÃO reescreva o runtime. Só edite o objeto SPEC lá embaixo

  SPEC = {
    eyebrow, title, subtitle(html), source,
    tiles: [{color, label, value, note}],
    sections: [
      { title, sub, chart: {                       // gráfico de barras (1 série)
          type:'bars', unit:'%'|'R$'|'', dec, color:'accent'|'c1'|'#hex',
          data:[{label, mean, std?, partial?}] } },
      { title, sub, chart: {                        // barras agrupadas (N séries)
          type:'grouped', unit, dec,
          series:[{name, color}],                   // 2-3; cores c1/c2/c3
          groups:[{label, values:[{mean,std?}], partial?}] } },
      { title, sub, chart: {                        // linha (série temporal / ordinal)
          type:'line', unit, dec,
          xlabels:[...], series:[{name, color, data:[num,...]}] } },
      { title, sub, chart: {                        // tabela-mapa (heatmap por bucket)
          type:'heat', unit, dec, cols:[...],
          rows:[{label, values:[num,...]}],
          buckets:[{lt:8,cls:'s'},{lt:20,cls:'m'},{cls:'v'}] } },  // s=verde m=amarelo v=vermelho
      { title, sub, html:'<p>...</p>' }             // seção de prosa livre
    ],
    footer
  }
  Regras: 1 eixo por gráfico; hues categóricas em ordem fixa (c1,c2,c3), nunca cicladas;
  legenda quando >=2 séries; hastes = ±1 desvio (passe std) pra mostrar estabilidade;

-->

<p style="margin-top:14px"><b>O caso que interessa é o HQLB frio.</b> Ali o modelo <b>não</b> separou (lift 0,90x, 60,9% de chance de ser sorte), e mesmo assim a campanha devolveu <b>R$ 17.654</b> de lucro com ROAS 1,29. Ordenar leads e gerar lucro são coisas diferentes.</p>
<p class="ic"><b>Como ler a coluna do lift junto com a da sorte.</b> Um lift grande acompanhado de uma chance de sorte grande, como o 3,60x do TOP50 com 9,1%, não quer dizer que o modelo funcionou ali: quer dizer que a campanha é pequena demais para saber. Com 9 alunos no total, trocar um único comprador de balde vira o número. A coluna "Separou?" só diz sim quando o resultado sobrevive a esse teste.</p>
<p><b>A explicação é que o modelo faz dois trabalhos, e só um deles é o ranking.</b> O primeiro trabalho acontece <b>antes de o lead existir</b>: o evento que o modelo dispara para a Meta a cada lead bom vira o alvo de otimização da campanha, e a Meta sai caçando gente parecida com quem já pontuou alto. É assim que o sinal <b>constrói o público</b>. O segundo trabalho é <b>ordenar os leads</b> depois que eles chegam. São medições em momentos diferentes, e é por isso que uma pode falhar com a outra funcionando.</p>
<p><b>E há um motivo mecânico para o ranking parecer fraco justamente onde o público é bom.</b> Quando o primeiro trabalho funciona, ele corta o fundo da régua antes de o lead entrar: o HQLB frio recebeu só 6,3% de leads no D1-D2, contra 26,7% do Lead frio. Sobra um público comprimido no meio e no topo, e ordenar gente parecida entre si é muito mais difícil do que separar bom de ruim. É o mesmo efeito de comparar aprovados de um vestibular: entre quem já passou, a nota da prova quase não prevê o desempenho no curso, porque a seleção já jogou fora a variação que a nota enxergava. A prova de que o público veio melhor está na conversão: <b>0,668%</b> no HQLB frio contra <b>0,325%</b> do Lead frio, 2,05 vezes mais.</p>
<h4 class="cap">O histórico: o abr_28 no público frio, lançamento a lançamento</h4>
<p style="margin-bottom:12px">Antes de decidir qualquer coisa, a pergunta certa: a falha do DEV21 é o padrão dele ou a exceção? A nota do abr_28 está gravada em todo lead desde 25/05, primeiro rodando <b>em sombra</b> (pontuava tudo, sem comandar a verba) e, a partir de <b>22/06</b>, como o modelo principal da conta, quando passou a levar o orçamento e o objetivo de otimização na Meta.</p>
<div class="tw"><table class="tb"><thead><tr><th>Lançamento</th><th>Papel</th><th>Leads frios</th><th>Alunos</th><th>Conv topo</th><th>Conv resto</th><th>Lift</th><th>%D1-D2</th></tr></thead><tbody>

<tr><td><b>LF58</b></td><td>sombra</td><td>6.828</td><td>30</td><td>1,229%</td><td>0,239%</td><td class="pos"><b>5,15x</b></td><td>16,0%</td></tr>
<tr><td><b>LF59</b></td><td>sombra</td><td>4.716</td><td>19</td><td>0,746%</td><td>0,302%</td><td class="pos"><b>2,47x</b></td><td>13,6%</td></tr>
<tr><td><b>LF60</b></td><td>principal</td><td>8.554</td><td>44</td><td>0,841%</td><td>0,389%</td><td class="pos"><b>2,17x</b></td><td>7,3%</td></tr>
<tr><td><b>LF61</b></td><td>principal</td><td>7.093</td><td>52</td><td>1,118%</td><td>0,585%</td><td class="pos"><b>1,91x</b></td><td>7,9%</td></tr>
<tr><td><b>LF62</b></td><td>principal</td><td>6.788</td><td>43</td><td>1,139%</td><td>0,480%</td><td class="pos"><b>2,37x</b></td><td>11,1%</td></tr>
<tr><td><b>LF63</b></td><td>principal</td><td>6.389</td><td>37</td><td>0,683%</td><td>0,544%</td><td class=""><b>1,25x</b></td><td>9,8%</td></tr>
<tr class="ag"><td><b>DEV21</b></td><td>principal</td><td>10.890</td><td>81</td><td>0,811%</td><td>0,722%</td><td class=""><b>1,12x</b></td><td>9,5%</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>O DEV21 é o pior ponto da série, não o padrão.</b> No público frio o abr_28 ficou acima de 1 em <b>9 de 9 lançamentos</b>, com lift agrupado de <b>1,87x</b> (intervalo de 1,52 a 2,30, segurando o lançamento fixo) em 60.712 leads. Restringindo só às campanhas HQLB frias, 1,57x em 8 lançamentos. <b>Desativar no frio agora seria reagir ao pior ponto de uma série que aponta para o outro lado.</b></p>
<p><b>O que a série pede é vigilância, não desligamento.</b> Os dois lançamentos mais recentes são os dois mais fracos (1,25x no LF63 e 1,12x no DEV21). Dois pontos não fazem tendência, mas fazem um alerta: se o próximo lançamento frio vier abaixo de 1, aí sim a conversa de desligar ou retreinar se abre, com três pontos na mão. E repare na coluna %D1-D2 caindo de 19,8% para 9,5% ao longo da série: o público frio entregue foi ficando mais limpo, que é exatamente a compressão que dificulta o ranking descrita acima.</p>
<p><b>Três ressalvas que acompanham este ponto de atenção.</b> Primeira: o ponto fraco do DEV21 pode ser em boa parte <b>tamanho de amostra</b>. Com 81 compradores frios, o lift de 1,12x carrega um intervalo que vai de 0,69 a 1,83, e o 1,87x da série fica na beira de fora: o dado é compatível quase por inteiro com a escada de sempre mais azar de amostra. Segunda: mesmo onde o ranking falha, <b>separar não é dar lucro</b>, e o frio deste lançamento devolveu R$ 17.654 com ROAS 1,29. Terceira: se o terceiro ponto fraco vier, a <b>solução já está desenhada, e não é retreinar do jeito simples</b>. Retreinar o mesmo formulário com dado mais fresco já foi testado: o jul_24 ganha no quente (1,50x contra 1,29x) mas <b>empatou no frio deste lançamento</b> (1,26x contra 1,23x nos mesmos leads). Se a causa é a compressão descrita acima, o formulário saturou, e a saída é colocar no score <b>o que o formulário não vê</b>. O arsenal, já medido e em coleta: <b>entrar no grupo de WhatsApp</b> (separa ~3x dentro do mesmo decil; coleta no ar desde 10/06); a <b>nota do criativo por plataforma, com a fala do vídeo, dentro do score</b> (a única variante testada cujo ganho não toca o zero; no teste dos quatro braços, 92 compradores contra 67 na mesma fatia de tráfego); o <b>texto no teto</b> (a fala do vídeo como palpite inicial do criativo estreante na nota que ajusta o teto); e o <b>selo de comprador Hotmart</b> (~2x segurando a nota fixa, medido em 323 mil leads; a fusão com o modelo ainda não foi testada, de propósito, porque só o selo capturado ANTES da venda vale, e essa coleta roda desde 30/07). Mais duas possibilidades ainda sem dado: a <b>página de captura</b> e o <b>campo de texto aberto da pesquisa</b>. O A/B champion contra challenger deixa qualquer troca sem risco: o desafiante roda ao lado do titular até provar.</p>` },

<tr><td>HQLB · QUENTE</td><td>0,79%</td><td>1,17%</td><td>1,49x</td><td><span class="ruido">1 em 1, pode ser sorte</span></td><td>dentro do ruído</td></tr>
<tr><td>HQLB · FRIO</td><td>0,37%</td><td>0,76%</td><td>2,05x</td><td><span class="ruido">1 em 2, pode ser sorte</span></td><td>dentro do ruído</td></tr>

<p style="margin-top:14px"><b>Dentro da mesma campanha, este lançamento não distingue criativo por conversão.</b> No HQLB quente o intervalo do melhor contra o pior vai de 0,53x a 6,24x: cabe tudo ali dentro. Só o Google chega perto.</p>
<p><b>Isso não desmente a alavanca de 2,1x do criativo</b>, que vem de 534 unidades em 26 lançamentos. Diz outra coisa: <b>um lançamento sozinho não tem tamanho para medir criativo por conversão</b>, e é por isso que a fórmula do teto pesa o histórico de cada criativo. A leitura do DEV21 sobre criativo é de <b>alocação de verba e custo por lead</b>, não de conversão.</p>` },
    { title:"A campanha de Lead recebeu os melhores criativos e ainda assim perdeu dinheiro",
      sub:"Aqui \"histórico do criativo\" quer dizer quantos leads aquele anúncio já tinha acumulado nos 26 lançamentos anteriores, o currículo dele. Não tem relação com o volume que ele trouxe no DEV21.",
      html:`<div class="tw"><table class="tb"><thead><tr><th>&nbsp;</th><th>Campanha de <b>Lead</b></th><th>Campanhas de <b>modelo</b></th></tr></thead><tbody>
<tr><td>Currículo do criativo (leads acumulados antes do DEV21)</td><td class="pos"><b>38.101</b></td><td>808</td></tr>
<tr><td>Nota histórica desse currículo</td><td class="pos"><b>1,05</b>, na média</td><td>0,61, abaixo da média</td></tr>
<tr><td>CPL pago</td><td class="pos"><b>R$ 4,62</b>, o mais barato do lançamento</td><td>R$ 6,07 a R$ 9,08</td></tr>
<tr><td>Leads entregues no fundo da régua (D1-D2)</td><td class="neg"><b>24,1%</b></td><td>5,4%</td></tr>
<tr><td>Leads entregues no topo (D9-D10)</td><td class="neg">14,8%</td><td class="pos"><b>35,3%</b></td></tr>
<tr class="ag"><td>Resultado</td><td class="neg"><b>ROAS 0,89 · prejuízo de R$ 813</b></td><td class="pos"><b>ROAS 1,90</b></td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>Os três anúncios que rodaram na campanha de Lead são os de maior currículo do lançamento inteiro</b>, com 42.180, 38.101 e 28.634 leads de passado. A qualidade desse passado, medida pela nota histórica (quanto o anúncio converte contra a média dos lançamentos em que rodou, onde 1,00 é a média), foi de <b>1,06</b> ponderada pelo gasto: um baralho na média, não acima dela. Já as campanhas de modelo rodaram um baralho claramente pior: nota ponderada de <b>0,64</b>.</p>
<p><b>É por isso que o argumento fecha nas duas direções.</b> A campanha de Lead perdeu dinheiro com criativos na média e com o lead mais barato do lançamento: preço a favor, criativo neutro, e ainda assim ROAS 0,89. As campanhas de modelo entregaram ROAS 1,90 carregando criativos <b>65% piores</b> que os do Lead pela nota histórica. A vitória delas não veio do criativo, e a derrota do Lead não veio nem do criativo nem do preço. O que sobrou de diferente é <b>para quem a Meta entregou os anúncios</b>.</p>
<p><b>Uma ressalva honesta:</b> nenhum dos três criativos do Lead rodou em qualquer outra campanha, então não dá para parear o mesmo anúncio entre a campanha de Lead e as de modelo. Mas o desequilíbrio pende para o lado do Lead, ou seja, contra a conclusão, o que só a deixa mais segura.</p>` },

    { title:"O teste final: o teto funcionou?",
      sub:"O teto é a métrica que junta as duas variáveis numa só nota: qualidade do lead (a mistura de decis do modelo) e qualidade do criativo (o histórico dele). A pergunta é direta: quem pagou abaixo do teto rendeu mais do que quem pagou acima?",
      html:`<div class="tw"><table class="tb"><thead><tr><th>Recorte</th><th>Unidades dentro / acima</th><th>Verba dentro / acima</th>
<th>% bateram ROAS 2</th><th>acima</th><th>ROAS médio</th><th>acima</th><th>Razão</th><th>Chance de ser sorte</th></tr></thead><tbody>
<tr><td>Todas as unidades</td><td>14 / 11</td><td>R$ 107.541 / R$ 53.044</td><td class="pos"><b>64%</b></td><td class="neg">9%</td><td class="pos"><b>2,19</b></td><td class="neg">1,26</td><td><b>1,73x</b></td><td><b class="ok">p=0,012</b><br><span class="ic">Mann-Whitney 0,011</span></td></tr>
<tr><td>Sem o público quente</td><td>10 / 11</td><td>R$ 49.832 / R$ 53.044</td><td class="pos"><b>60%</b></td><td class="neg">9%</td><td class="pos"><b>2,07</b></td><td class="neg">1,26</td><td><b>1,64x</b></td><td><b class="ok">p=0,024</b><br><span class="ic">Mann-Whitney 0,049</span></td></tr>
<tr><td>Só o público quente</td><td>4 / 0</td><td>R$ 57.709</td><td colspan=6 class="z">as 4 unidades ficaram <b>dentro</b> do teto: não há grupo acima para comparar</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>Sim, funcionou, e nos dois recortes.</b> Quem pagou dentro do teto entregou ROAS <b>2,19</b> contra <b>1,26</b> de quem pagou acima, com <b>64% contra 9%</b> de unidades batendo a meta. São 25 unidades cobrindo <b>92,9% da verba do lançamento</b>.</p>
<p><b>E não é o público quente carregando.</b> Tirando o quente inteiro, a separação continua em <b>1,64x</b> e segue significativa. <b>O quente nunca passou do teto</b>: as quatro unidades dele ficaram todas abaixo, o que é o motivo de aquela linha não ter comparação.</p>
<p><b>O que entrou no cálculo, e o que ficou de fora.</b> O mapa de decis, o valor por venda e o fator de rastreamento vêm da referência congelada na janela que termina em <b>13/07</b>, oito dias antes de a captação começar. O histórico de cada criativo foi fechado em <b>20/07</b>. O lift de plataforma do Google está aplicado. Nada do DEV21 entrou no cálculo do próprio DEV21.</p>` },
    { title:"Quanto da nota é modelo e quanto é criativo",
      sub:"A fórmula é conversão do modelo multiplicada pelo ajuste do criativo. O peso do criativo cresce com o passado dele: n dividido por n mais 2.000.",
      html:`<div class="tw"><table class="tb"><thead><tr><th>Ingrediente</th><th>Valor</th><th>Leitura</th></tr></thead><tbody>
<tr><td>Teto médio só com o <b>modelo</b></td><td>R$ 7,85</td><td>é o nível: quem define a ordem de grandeza</td></tr>
<tr><td>Teto médio já com o <b>criativo</b></td><td>R$ 7,10</td><td>o criativo ajustou o nível em <b>-9,5%</b></td></tr>
<tr><td>Peso do histórico na fórmula</td><td>45,4%</td><td>ponderado por verba, sobre todas as unidades</td></tr>
<tr><td>Unidades com peso de 50% ou mais</td><td>11 de 25</td><td>levaram R$ 66.709, 42% da verba</td></tr>
<tr><td>Criativos estreantes de verdade</td><td>2 de 25</td><td>só esses rodam com nota 100% modelo</td></tr>
<tr class="ag"><td>Amplitude do ajuste do criativo</td><td>0,74x a 1,31x</td><td>o criativo mexe a nota em até 26% para baixo e 31% para cima</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A divisão de trabalho é clara: o modelo dá o nível, o criativo corrige a margem.</b> Sozinho, o modelo apontaria um teto médio de R$ 7,85; com o criativo, R$ 7,10. O criativo não é passageiro, mas também não é o motorista.</p>
<p><b>E ele puxou o teto para baixo, não para cima.</b> O lift mediano dos criativos que levaram a verba do DEV21 foi de <b>0,73</b>, e <b>20 dos 23</b> ficaram abaixo de 1. Ou seja: a verba foi para criativos com passado abaixo da média, e o teto reconheceu isso apertando o limite. Foi esse aperto que produziu a separação medida acima.</p>` },

    { title:"CPL barato prevê lucro?",
      sub:"Três regras de decisão sobre as mesmas 25 unidades de verba, com a mesma fórmula, o mesmo valor por venda e o mesmo alvo de ROAS 2. A única diferença entre elas é quanta informação cada uma enxerga.",
      html:`<p style="margin-bottom:14px">Para a comparação ser justa, o corte de \"CPL barato\" não pode ser um número escolhido a dedo. Ele é a <b>mesma conta do teto</b>, só que usando a conversão média do negócio em vez da nota do lead: <b>R$ 6,64</b> para todo mundo, igual. É literalmente o teto de quem não olha o lead nem o criativo.</p>
<div class="tw"><table class="tb"><thead><tr><th>Regra</th><th>Aprova / reprova</th><th class="sp">Conv aprovada</th><th>Conv reprovada</th><th>Razão</th>
<th>ROAS aprov. / repr.</th><th>Razão</th><th>Lucro por real</th><th>Chance de ser sorte</th></tr></thead><tbody>
<tr><td><b>CPL barato (teto plano, não olha o lead)</b></td><td>12 / 13</td><td class="sp">0,774%</td><td>0,719%</td><td><b>1,08x</b></td><td>2,27 / 1,54</td><td><b>1,48x</b></td><td>R$ 1,27 / R$ 0,54</td><td><b class="ok">1,5%</b></td></tr>
<tr><td><b>Teto com o modelo</b></td><td>18 / 7</td><td class="sp">0,789%</td><td>0,543%</td><td><b>1,45x</b></td><td>2,04 / 1,19</td><td><b>1,72x</b></td><td>R$ 1,04 / R$ 0,19</td><td><b class="ok">2,0%</b></td></tr>
<tr class="ag"><td><b>Teto final: modelo x criativo</b></td><td>14 / 11</td><td class="sp">0,820%</td><td>0,574%</td><td><b>1,43x</b></td><td>2,19 / 1,26</td><td><b>1,73x</b></td><td>R$ 1,19 / R$ 0,26</td><td><b class="ok">1,2%</b></td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>O veredito é em lucro, e ele é este: das 25 unidades, a régua do teto guarda no grupo aprovado 90% do lucro do lançamento; a régua do CPL guarda 68%.</b> Régua de decisão se julga pelo que ela manda cortar: o grupo que a regra do CPL reprova gerou <b>R$ 45.584</b> de lucro (ROAS 1,54, dinheiro bom que seria cortado), enquanto o grupo que o teto reprova gerou R$ 13.938 (ROAS 1,26, perto do peso morto).</p>
<p><b>E sim, às vezes o lead barato que converte menos compensa. O teto é exatamente a conta de quando compensa.</b> A prova são as duas unidades mais baratas do lançamento, lado a lado, as duas na campanha de Lead: pela régua do CPL, as duas melhores compras do DEV21. O <b>AD0027</b> (CPL R$ 3,74) convertia 32% abaixo da média mas custava 45% menos: o desconto cobre o déficit, e o teto aprovou (valia até R$ 4,87). Devolveu <b>ROAS 2,26</b>. O <b>AD0150-V0</b> (CPL R$ 3,58) convertia 76% abaixo da média e custava só 47% menos: o desconto não cobre, e o teto reprovou (valia até R$ 2,94). Devolveu <b>0,84</b>. O CPL não distingue os dois; o teto distinguiu os dois <b>antes do resultado</b>.</p>
<p><b>"Ficar abaixo do teto" e "custo por qualificação" são a mesma régua dita de dois jeitos.</b> O teto da unidade é a conversão esperada dela (modelo x criativo) vezes o valor da venda, dividido pelo ROAS alvo. Pagar abaixo do teto é o mesmo que exigir que o <b>custo por venda esperada</b> fique abaixo de R$ 817, que é metade dos R$ 1.634 que a venda vale com o fator de rastreamento. CPL barato exige preço baixo em absoluto; o teto exige preço baixo <b>em relação ao que aquele lead vale</b>.</p>
<p><b>Por que a régua do CPL erra: ela não enxerga qualidade.</b> Ela aprova leads que convertem 0,774% e reprova leads que convertem 0,719%, a mesma coisa. As regras de teto aprovam leads que convertem <b>43% mais</b> que os que reprovam. O ganho de ROAS que a regra do CPL ainda assim mostra é em parte aritmético, porque o CPL é o denominador do próprio ROAS, e o número acima mostra o que sobra dele: um corte que joga fora R$ 45.584 de lucro para se proteger de pouco.</p>
<p><b>Sem corte nenhum a conclusão é a mesma.</b> Ordenando as 25 unidades pelo CPL puro, a concordância com o ROAS é de -0,37 numa régua de menos um a mais um, com 6,5% de chance de ser acaso: <b>não passa</b>. Ordenando pela folga contra o teto do modelo, a concordância vai para <b>-0,65</b> com 0,04% de chance de acaso. Dividir todo mundo pelo mesmo teto plano dá exatamente a mesma ordem do CPL puro, o que é a prova de que os dois são a mesma regra.</p>
<h4 class="cap">Por que a campanha rendeu o que rendeu: qualidade dividida por preço</h4>
<p style="margin-bottom:12px">O ROAS de uma campanha contra o do lançamento se abre em exatamente dois fatores que se multiplicam: a conversão dela sobre a geral (<b>qualidade</b>) e o CPL geral sobre o dela (<b>preço</b>). Referência do lançamento: conversão 0,759%, CPL R$ 6,76.</p>
<div class="tw"><table class="tb"><thead><tr><th>Campanha</th><th>ROAS</th><th>vs referência</th><th>Qualidade</th><th>Preço</th><th>Lucro</th></tr></thead><tbody>
<tr><td>HQLB · QUENTE</td><td>1,97</td><td>1,28</td><td class="pos"><b>1,14</b></td><td class="pos"><b>1,11</b></td><td class="pos">R$ 55.998</td></tr>
<tr><td>HQLB · FRIO</td><td>1,29</td><td>0,84</td><td class="neg"><b>0,88</b></td><td class="neg"><b>0,95</b></td><td class="pos">R$ 17.654</td></tr>
<tr><td>Google Ads</td><td>1,30</td><td>0,85</td><td class="pos"><b>1,15</b></td><td class="neg"><b>0,75</b></td><td class="pos">R$ 9.550</td></tr>
<tr><td>TOP30 · FRIO</td><td>2,48</td><td>1,62</td><td class="pos"><b>1,41</b></td><td class="pos"><b>1,11</b></td><td class="pos">R$ 7.541</td></tr>
<tr><td>TOP50 · FRIO</td><td>1,40</td><td>0,91</td><td class="neg"><b>0,89</b></td><td class="pos"><b>1,17</b></td><td class="pos">R$ 3.085</td></tr>
<tr><td>TOP10 · FRIO</td><td>0,61</td><td>0,40</td><td class="neg"><b>0,50</b></td><td class="neg"><b>0,88</b></td><td class="neg">-R$ 779</td></tr>
<tr><td>Lead · FRIO</td><td>0,89</td><td>0,58</td><td class="neg"><b>0,43</b></td><td class="pos"><b>1,46</b></td><td class="neg">-R$ 813</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A última linha responde a pergunta do título sozinha.</b> A campanha de Lead teve o <b>melhor preço do lançamento</b>, 46% abaixo da média, e mesmo assim perdeu dinheiro, porque a qualidade foi 0,43. O Google é o espelho: a segunda melhor qualidade do lançamento (1,15), estragada por um preço 25% pior que a média.</p>
<h4 class="cap">O quadrante que decide a troca de métrica</h4>
<div class="tw"><table class="tb"><thead><tr><th>Quadrante</th><th>Unidades</th><th>Verba</th><th>Conversão</th><th>ROAS</th><th>Lucro</th></tr></thead><tbody>
<tr><td>CPL barato · dentro do teto</td><td>8</td><td>R$ 67.683</td><td>0,772%</td><td class="pos">2,24</td><td>R$ 84.252</td></tr>
<tr><td>CPL barato · acima do teto</td><td>2</td><td>R$ 4.558</td><td>0,682%</td><td>2,51</td><td>R$ 6.878</td></tr>
<tr class="ag"><td><b>CPL caro · dentro do teto</b></td><td><b>6</b></td><td><b>R$ 39.859</b></td><td><b>0,925%</b></td><td class="pos"><b>2,09</b></td><td class="pos"><b>R$ 43.460</b></td></tr>
<tr><td>CPL caro · acima do teto</td><td>9</td><td>R$ 48.486</td><td class="neg">0,556%</td><td class="neg">1,15</td><td>R$ 7.060</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A linha destacada é o motivo de trocar de métrica.</b> São 6 unidades com CPL acima da média, que qualquer régua de CPL teria marcado como caras, e que entregaram ROAS <b>2,09</b> e <b>R$ 43.460</b> de lucro. Elas eram caras porque o lead valia o preço. Dentro do grupo de CPL caro o teto separa 1,82x, com 4,4% de chance de ser sorte.</p>
<p><b>Sobre o pedaço do criativo, uma ressalva de tamanho de amostra.</b> As regras 2 e 3 dão o <b>mesmo veredito em 21 das 25 unidades</b> e discordam em 4. Com quatro unidades de diferença nenhum teste decide se o ajuste do criativo melhora ou não a previsão. Este lançamento <b>não tem tamanho para responder isso</b>, e por isso ele não confirma nem contradiz os testes do projeto que mediram o criativo lead a lead, em 26 lançamentos, onde ele ganha com folga.</p>` },
    { title:"O próximo passo do score, já validado: a nota do criativo dentro dele",
      sub:"Hoje o criativo só ajusta o teto de CPL. O passo seguinte, já medido em base própria e ainda não aplicado, é a nota histórica do criativo multiplicar o próprio score que vai para a Meta.",
      html:`<p style="margin-bottom:12px">O teste: 63.544 leads pontuados pelo abr_28 entre 25/05 e 03/08, 314 compradores, 30 criativos. A nota de cada criativo foi recalculada semana a semana usando só o passado dele, nada do futuro. Quatro versões do score, mesma população, mesma régua:</p>
<div class="tw"><table class="tb"><thead><tr><th>Versão do score</th><th>Acerto de ordenação (AUC)</th><th>Lift do D10</th><th>Compradores no top 10%</th></tr></thead><tbody>
<tr><td>Só a nota do criativo</td><td>0,612</td><td>1,43x</td><td>41</td></tr>
<tr><td>Só o modelo (abr_28), o que roda hoje</td><td>0,640</td><td>1,69x</td><td>67</td></tr>
<tr class="ag"><td><b>Modelo x nota do criativo</b></td><td><b>0,677</b></td><td><b>2,42x</b></td><td><b>76</b></td></tr>
<tr><td>Modelo x nota x fala do vídeo</td><td>0,681</td><td class="pos"><b>2,93x</b></td><td class="pos"><b>92</b></td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A régua da tabela:</b> o acerto de ordenação é a chance de o score pôr um comprador acima de um não-comprador num par sorteado (0,5 = moeda, 1,0 = perfeito). O lift do D10 é quanto o decil de cima converte contra a média. E a última coluna é a mais concreta: na mesma fatia de 10% do tráfego, o score composto encontra <b>76 compradores onde o modelo sozinho encontra 67</b>; com a fala do vídeo, <b>92</b>.</p>
<p><b>O ganho não é sorte de uma amostra.</b> Reamostrando por criativo inteiro 400 vezes (o jeito honesto, porque lead do mesmo criativo não é observação independente), o composto ganha do modelo sozinho em <b>100% das reamostras</b>. Numa segunda base, com a nota separada por canal, o ganho se repete com intervalo que não toca o zero.</p>
<p><b>Status: validado offline, não aplicado.</b> O destino desenhado é entrar como <b>desafiante</b> do score que vai para a Meta, com backtest walk-forward antes de encostar em produção. É o item "a aplicar" da troca de métrica: o teto já usa o criativo na régua de preço; isto o coloca na régua de público.</p>` },
    { title:"As próximas alavancas já medidas",
      sub:"Nada nesta seção é resultado do DEV21: são os dois sinais já validados em base própria que ainda não entraram em produção. O primeiro responde 'se o criativo importa, dá para saber antes de gastar?'. O segundo é um comportamento do lead que o modelo comprovadamente não enxerga.",
      html:`<div class="tw"><table class="tb"><thead><tr><th>Sinal</th><th>O que é</th><th>Separação topo/base</th><th>Concordância</th><th>Chance de ser sorte</th></tr></thead><tbody>
<tr><td><b>Fala do vídeo</b></td><td>a transcrição do que é dito no anúncio</td><td><b>1,95x</b></td><td>+0,40</td><td class="ok"><b>0,31%</b></td></tr>
<tr><td><b>Ritmo de fala</b></td><td>palavras divididas pela duração</td><td><b>1,94x</b></td><td>+0,42</td><td class="ok"><b>~0%</b></td></tr>
<tr class="ag"><td><b>Os dois juntos</b></td><td>a média das duas ordens</td><td class="pos"><b>2,70x</b></td><td><b>+0,55</b></td><td class="ok"><b>0,00%</b></td></tr>
</tbody></table></div>
<p style="margin-top:14px">Base: 65 vídeos distintos, 4.126 compradores. A concordância está numa régua de menos um a mais um, onde zero é fila embaralhada e um é a mesma fila.</p>
<p><b>O ritmo em caixa, que é o achado mais barato do projeto:</b> o terço de vídeos mais lentos fala 3,28 palavras por segundo e converte <b>0,69%</b>. O terço mais rápido fala 3,98 e converte <b>1,12%</b>. Um número só, sem nenhum processamento de linguagem, e vale quase o mesmo que a análise completa do texto.</p>
<p><b>E os dois não são a mesma coisa medida duas vezes.</b> A concordância entre eles é de apenas +0,10, com 44% de chance de ser acaso, ou seja, medem coisas diferentes. É por isso que juntá-los sobe para 2,70x em vez de empatar.</p>
<p><b>Três ressalvas que precisam viajar junto com esses números.</b> Primeira: o gancho, ou seja, só as primeiras palavras do vídeo, foi <b>testado e não é melhor</b> que o vídeo inteiro. Segunda: a duração inclui silêncio e trilha, então \"ritmo\" pode estar medindo quanto do vídeo é fala, e não velocidade de fala. Terceira, a mais importante: o papel disto é dar um <b>palpite inicial para criativo estreante</b>, quando ainda não há histórico próprio. Onde o anúncio já tem passado, o histórico manda e o texto empata com ele.</p>
<p><b>E uma pergunta aberta que esses números sugerem.</b> Até aqui a fala do vídeo foi medida contra uma coisa só: a conversão do anúncio. Mas se o texto prevê o que o anúncio rende, ele pode prever também <b>quem</b> o anúncio atrai: a mistura de decis, as respostas do formulário, o perfil do lead. Ainda não medimos isso. Se a resposta for sim, o texto vira alavanca dupla: escolhe o vídeo antes de gastar e antecipa a qualidade do público que ele vai trazer.</p>
<h4 class="cap">A segunda alavanca: entrar no grupo de WhatsApp</h4>
<div class="tw"><table class="tb"><thead><tr><th>Medida</th><th>Valor</th><th>Leitura</th></tr></thead><tbody>
<tr><td>Conversão de quem <b>entrou</b> no grupo</td><td><b>0,69%</b></td><td rowspan="2">separação de <b>3,2x</b>, medida em 8 lançamentos, ~100 mil leads</td></tr>
<tr><td>Conversão de quem <b>não entrou</b></td><td class="neg">0,22%</td></tr>
<tr class="ag"><td>O teste que importa: dentro do <b>mesmo decil</b></td><td><b>~3x em todos</b></td><td>no D10: 1,03% contra 0,34%. O sinal sobrevive a segurar a nota do modelo fixa</td></tr>
<tr><td>Quantos respondentes entram no grupo</td><td>~65%</td><td>sinal frequente, não raridade</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A linha destacada é o motivo de isto estar aqui.</b> Um sinal novo só vale alguma coisa se disser algo que o modelo ainda não sabe. Segurando o decil fixo, quem entrou no grupo converte cerca de <b>3 vezes</b> quem não entrou, em <b>todos</b> os decis. Ou seja: é informação que o formulário não carrega e o modelo não captura. É comportamento, não declaração.</p>
<p><b>Onde isso está hoje.</b> A coleta está no ar desde <b>10/06</b>, gravando cada entrada de grupo em tabela própria, porque a ferramenta do cliente apaga o histórico em 90 dias: sem a coleta, cada lançamento não capturado sumiria para sempre. O que falta é honesto: o ganho <b>dentro do modelo</b> ainda não foi provado, porque o teste disponível tinha só 44 conversões na fatia de avaliação, pouco para decidir. A feature entra em avaliação no próximo retreino, quando houver lançamentos cobertos o bastante.</p>
<h4 class="cap">A terceira, ainda teórica: a página de captura</h4>
<p><b>Esta não tem dado nenhum, e entra como proposta.</b> O raciocínio é o do texto do anúncio, um passo adiante no funil: entre o clique e o formulário existe a página, e o que ela diz pode mexer tanto em <b>quantos</b> leads entram quanto em <b>quem</b> entra. Hoje a página está fora de tudo o que medimos. Se o estudo valer a pena, começa como o do vídeo começou: versões registradas, leads casados por origem, conversão por versão.</p>` },
    { title:"Metodologia e reprodução",
      sub:"De onde veio cada número. O documento completo, com os scripts copiados e as fórmulas, vive no repositório em V2/docs/relatorios/dev21_modelo_criativo_teto/ (METODOLOGIA.md).",
      html:`<div class="tw"><table class="tb"><thead><tr><th>Bloco</th><th>Fonte de dados</th><th>Universo</th><th>Script</th></tr></thead><tbody>
<tr><td>Negócio por campanha (1-6)</td><td>Railway Client x UTMTracking + analytics.sales + ad_spend</td><td>27.317 cadastros, last-touch por email</td><td>painel_dev21.py</td></tr>
<tr><td>Separação do modelo (7-9, 16)</td><td>registros_ml (decil dos 2 modelos) + sales</td><td>24.158 respondentes; abr_28 cobre 24.047, jul_24 16.509</td><td>modelo_dev21.py + separacao.py</td></tr>
<tr><td>Dinheiro por decil (10)</td><td>as mesmas bases, custo = CPL da unidade criativo x campanha</td><td>25.562 leads pagos (93,6%)</td><td>lacunas.py</td></tr>
<tr><td>Série histórica fria (11)</td><td>registros_ml com o decil do abr_28 lido das DUAS colunas + launch_calendar</td><td>60.712 leads frios, LF56 a DEV21</td><td>historico_frio2.py</td></tr>

<tr><td>Backtest do teto (17-19)</td><td>reference_rolling congelada em 13/07 + captacoes até 20/07</td><td>25 unidades (100+ leads, R$ 300+), 92,9% da verba</td><td>teto_v2.py</td></tr>
<tr><td>Corrida CPL vs teto (20)</td><td>derivada do backtest; teto plano = mesma fórmula com a conversão geral</td><td>as mesmas 25 unidades</td><td>corrida2.py + lacunas2.py</td></tr>
<tr><td>Score composto e alavancas (21-22)</td><td>registros da memória do projeto (não recalculados aqui)</td><td>63.544 leads (composto); 65 vídeos (texto); ~100 mil (grupo)</td><td>sessões de 05/08 e 09/06</td></tr>
</tbody></table></div>
<p style="margin-top:14px"><b>A régua de negócio, idêntica ao debriefing do cliente:</b> só produto principal (sem Operação 50k e sem MBA), três devoluções removidas, combos à parte, boleto a 50% no faturamento, gasto da Meta com 13% de imposto e Google sem. Captação 21/07 a 03/08, vendas 10 a 16/08, casamento lead-venda por email, telefone e últimos 6 dígitos.</p>
<p><b>As três regras de honestidade que valem para o relatório inteiro.</b> Primeira: nada do DEV21 entra no cálculo que julga o DEV21 (a referência do teto congela em 13/07 e o histórico de criativo fecha em 20/07). Segunda: o decil histórico do abr_28 é lido de onde ele estiver gravado, porque o carimbo de papel no banco só vale a partir de 25/07, e o papel real veio da verba na Meta desde 22/06. Terceira: criativo casa por grafia canônica (acento, caixa, espaço e carimbo do Google unificados), correção que entrou em produção no PR #237.</p>
<p><b>Para reproduzir ou atualizar:</b> os 18 scripts estão copiados em <b>V2/docs/relatorios/dev21_modelo_criativo_teto/scripts/</b>, com a ordem de execução, as dependências entre eles e as armadilhas conhecidas documentadas no METODOLOGIA.md ao lado. A única edição necessária é apontar a constante S de cada script para um diretório de trabalho novo. O snapshot desta página está congelado na mesma pasta.</p>` },

<p><b>As três devoluções saíram.</b> São quatro transações do Guru, todas do FullStack Pro OFICIAL, de três pessoas, somando R$ 8.788,48. Elas estavam gravadas na nossa base e foram removidas aqui. Nenhuma das outras quatro plataformas teve devolução no período.</p>
<p><b>Orgânico e "não está na base" não têm ROAS.</b> Não existe mídia comprada para eles, então dividir por zero não diz nada. O orgânico, ainda assim, é o de melhor conversão do lançamento.</p>
<p><b>Uma limitação de atribuição que continua.</b> A base de cadastros guarda origem e campanha, mas não o campo que identifica a campanha do Google, então parte do Google entra pelo agregado e não por campanha individual.</p>

/* ==== runtime (não precisa mexer) ==== */
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const col=c=>!c?"var(--c1)":(c[0]==="#"?c:`var(--${c})`);
const svg=(w,h)=>{const s=document.createElementNS(SVGNS,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("role","img");return s;};
const A=(p,t,at)=>{const e=document.createElementNS(SVGNS,t);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e;};
const T=(p,x,y,cls,s,anc="middle")=>{const t=A(p,"text",{x,y,class:cls,"text-anchor":anc});t.textContent=s;return t;};
const tip=document.getElementById("tip");
const hov=(e,html)=>{e.addEventListener("mousemove",ev=>{tip.innerHTML=html;tip.style.opacity=1;tip.style.left=ev.clientX+"px";tip.style.top=ev.clientY+"px";});e.addEventListener("mouseleave",()=>tip.style.opacity=0);};
const fmt=(v,ch)=>{const d=ch.dec??(ch.unit==="%"?1:0);return (ch.unit==="R$"?"R$":"")+(+v).toFixed(d)+(ch.unit==="%"?"%":"");};
const fmtAx=(v,ch)=>(ch.unit==="R$"?"R$":"")+v;
function scale(maxv){let ym=maxv*1.14;const steps=[1,2,5,10,20,25,50,100,200,500,1000];let st=steps.find(s=>ym/s<=5)||1000;ym=Math.ceil(ym/st)*st;const t=[];for(let v=0;v<=ym+1e-6;v+=st)t.push(+v.toFixed(6));return{ym,t};}
const W=760,H=360,M={t:26,r:14,b:42,l:46},PW=W-M.l-M.r,PH=H-M.t-M.b;
function axis(s,ym,ticks,ch){const y=v=>M.t+PH*(1-v/ym);ticks.forEach(tk=>{A(s,"line",{x1:M.l,x2:W-M.r,y1:y(tk),y2:y(tk),class:"grid-l"});T(s,M.l-8,y(tk)+3.5,"axis-t",fmtAx(tk,ch),"end");});return y;}
function whisker(s,cx,yt,yb,cap){A(s,"line",{x1:cx,x2:cx,y1:yt,y2:yb,class:"whisk"});A(s,"line",{x1:cx-cap,x2:cx+cap,y1:yt,y2:yt,class:"whisk"});A(s,"line",{x1:cx-cap,x2:cx+cap,y1:yb,y2:yb,class:"whisk"});}

function bars(host,ch){
  const mx=Math.max(...ch.data.map(d=>d.mean+(d.std||0)));const{ym,t}=scale(mx);const s=svg(W,H);const y=axis(s,ym,t,ch);
  const slot=PW/ch.data.length,bw=Math.min(46,slot*0.5);
  ch.data.forEach((d,i)=>{const cx=M.l+slot*(i+.5);
    const r=A(s,"rect",{x:cx-bw/2,y:y(d.mean),width:bw,height:Math.max(0,M.t+PH-y(d.mean)),rx:4,class:"bar"+(d.partial?" part":""),style:`fill:${col(ch.color)}`});
    hov(r,`<b>${d.label}</b> · ${fmt(d.mean,ch)}${d.std!=null?` · σ ±${d.std}`:""}`);
    if(d.std!=null)whisker(s,cx,y(d.mean+d.std),y(Math.max(0,d.mean-d.std)),6);
    T(s,cx,y(d.mean+(d.std||0))-7,"vlab",fmt(d.mean,ch));
    T(s,cx,H-M.b+20,"xlab"+(d.partial?" part":""),d.label);});
  host.appendChild(s);
}
function grouped(host,ch){
  const mx=Math.max(...ch.groups.flatMap(g=>g.values.map(v=>v.mean+(v.std||0))));const{ym,t}=scale(mx);const s=svg(W,H);const y=axis(s,ym,t,ch);
  const n=ch.series.length,slot=PW/ch.groups.length,bw=Math.min(24,slot*0.7/n),gap=3,span=n*bw+(n-1)*gap;
  ch.groups.forEach((g,i)=>{const gc=M.l+slot*(i+.5);
    g.values.forEach((v,j)=>{const cx=gc-span/2+bw/2+j*(bw+gap);
      const r=A(s,"rect",{x:cx-bw/2,y:y(v.mean),width:bw,height:Math.max(0,M.t+PH-y(v.mean)),rx:4,class:"bar"+(g.partial?" part":""),style:`fill:${col(ch.series[j].color)}`});
      hov(r,`<b>${g.label}</b> · ${ch.series[j].name} ${fmt(v.mean,ch)}${v.std!=null?` · σ ±${v.std}`:""}`);
      if(v.std!=null)whisker(s,cx,y(v.mean+v.std),y(Math.max(0,v.mean-v.std)),5);
      T(s,cx,y(v.mean+(v.std||0))-6,"vlab",fmt(v.mean,ch));});
    T(s,gc,H-M.b+20,"xlab"+(g.partial?" part":""),g.label);});
  host.appendChild(s);
}
function line(host,ch){
  const all=ch.series.flatMap(se=>se.points);const{ym,t}=scale(Math.max(...all));const s=svg(W,H);const y=axis(s,ym,t,ch);
  const n=ch.xlabels.length,step=PW/(n-1||1),x=i=>M.l+step*i;
  ch.series.forEach(se=>{const c=col(se.color);
    let dpath=se.points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p)).join(" ");
    A(s,"path",{d:dpath,fill:"none",style:`stroke:${c}`,"stroke-width":2.2,"stroke-linejoin":"round","stroke-linecap":"round"});
    se.points.forEach((p,i)=>{const m=A(s,"circle",{cx:x(i),cy:y(p),r:4,class:"mk",style:`fill:${c}`});hov(m,`<b>${ch.xlabels[i]}</b> · ${se.name}: ${fmt(p,ch)}`);});});
  ch.xlabels.forEach((l,i)=>T(s,x(i),H-M.b+20,"xlab",l));
  host.appendChild(s);
}
function heat(host,ch){
  const tb=el("table"),th=el("thead"),tr=el("tr");tr.appendChild(el("th","metric","Métrica"));
  ch.cols.forEach(c=>{const e=el("th",null,c);tr.appendChild(e);});th.appendChild(tr);tb.appendChild(th);
  const bd=el("tbody");
  ch.rows.forEach(r=>{const t=el("tr");const m=el("td","metric",r.label);t.appendChild(m);
    r.values.forEach(v=>{const b=ch.buckets.find(bk=>bk.lt==null||v<bk.lt)||ch.buckets[ch.buckets.length-1];
      const td=el("td",null,`<span class="chip cv-${b.cls}">${fmt(v,ch)}</span>`);t.appendChild(td);});
    bd.appendChild(t);});
  tb.appendChild(bd);host.appendChild(tb);
}

function build(){
  const app=document.getElementById("app");
  if(SPEC.eyebrow)app.appendChild(el("p","eyebrow",SPEC.eyebrow));
  app.appendChild(el("h1",null,SPEC.title));
  if(SPEC.subtitle)app.appendChild(el("p","sub",SPEC.subtitle));
  if(SPEC.source)app.appendChild(el("p","sub src",SPEC.source));
  if(SPEC.tiles?.length){const g=el("div","tiles");SPEC.tiles.forEach(t=>{
    const d=el("div","tile");d.innerHTML=`<div class="lab"><span class="dot" style="background:${col(t.color)}"></span>${t.label}</div><div class="val"${t.value&&/vol|instáv|crít/i.test(t.value)?' style="color:var(--v)"':''}>${t.value}</div>${t.note?`<div class="note">${t.note}</div>`:""}`;g.appendChild(d);});app.appendChild(g);}
  SPEC.sections.forEach(sec=>{const s=el("section");s.appendChild(el("h2",null,sec.title));if(sec.sub)s.appendChild(el("p","h2sub",sec.sub));
    if(sec.html){const p=el("div","prose",sec.html);s.appendChild(p);}
    else{const ch=sec.chart;
      if(ch.type==="grouped"||(ch.type==="line"&&ch.series.length>1)){const lg=el("div","legend");ch.series.forEach(se=>lg.innerHTML+=`<span><span class="dot" style="background:${col(se.color)}"></span>${se.name}</span>`);if(ch.type==="grouped"&&ch.groups.some(g=>g.values.some(v=>v.std!=null)))lg.innerHTML+='<span style="color:var(--faint)">haste = ±1 desvio</span>';s.appendChild(lg);}
      const card=el("div","card");s.appendChild(card);
      ({bars,grouped,line,heat}[ch.type]||(()=>{}))(card,ch);}
    app.appendChild(s);});
  if(SPEC.footer)app.appendChild(el("p","foot",SPEC.footer));
}
build();
</script>
