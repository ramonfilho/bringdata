# Varredura de dependências: escopo decidido em 14/09/2026.
#
# O que entra:
#   1. V2/api/requirements.txt  -> o que vai para a imagem de produção (scorer, jobs, monitoring).
#   2. V2/requirements-dev.txt  -> o que o CI usa (pytest, ruff, mlflow de leitura).
#   3. .github/workflows        -> as actions (checkout, auth, setup-gcloud...), por SHA de tag.
# O que fica de fora:
#   - V2/scripts/requirements_google_ads_setup.txt: setup pontual, roda na mão, não vai para imagem.
#   - Atualização de versão MAIOR ou MENOR das libs que o modelo salvo assume (scikit-learn,
#     numpy, pandas, scipy, joblib): o pickle do RandomForest foi gravado com a versão pinada
#     e uma troca dessas é PR de retreino, não de dependência. Correção de segurança (patch)
#     continua entrando.
# Ritmo: semanal, segunda de manhã, PRs agrupadas para não virar ruído. Cada PR passa pelo
# CI (lint, 953 testes, gate do modelo) como qualquer outra, e o merge só sai com os checks
# verdes (proteção da main).
version: 2
updates:
  - package-ecosystem: pip
    directory: /V2/api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      producao:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: pandas
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: scipy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: joblib
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # matplotlib 3.11+ exige Python 3.11; a imagem é 3.10 (PR #277 quebrava o pip).
      - dependency-name: matplotlib
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # requirements-treino.txt mora aqui: mlflow 3 migraria o schema do Postgres de
      # tracking, e pyarrow major muda o parquet que o pandas 2.0.3 lê.
      - dependency-name: mlflow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: pyarrow
        update-types: ["version-update:semver-major"]
      # google-cloud-storage 3 conflita com google-auth 2.25.2 pinado (PR #278); sobe
      # junto com google-auth, numa PR nossa.
      - dependency-name: google-cloud-storage
        update-types: ["version-update:semver-major"]
      # google-cloud-logging 3.16 e google-cloud-pubsub 2.40 exigem protobuf >= 6.33;
      # mlflow 2.13 (requirements-treino.txt, instalado junto no CI) exige protobuf < 5.
      # Sobem quando o mlflow subir (PR #315 caiu em ResolutionImpossible).
      - dependency-name: google-cloud-logging
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: google-cloud-pubsub
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencias"]
    commit-message:
      prefix: "deps(api)"

  - package-ecosystem: pip
    directory: /V2
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    groups:
      dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # O grupo dev segue o include (-r api/requirements.txt) e chegou a propor major de
      # PRODUÇÃO por fora da lista do /V2/api (PR #319, 18/09/2026: gunicorn 26 contra o
      # mlflow<24, gspread 6, google-cloud-storage 3, facebook-business 26). Major nenhum
      # entra por aqui; minor e patch passam pelo CI como qualquer PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Os pins científicos do dev seguem os da API: a suíte roda contra os mesmos
      # artefatos do modelo, e pandas 3 exige Python 3.11 (PR #314 quebrava o pip).
      - dependency-name: pandas
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: scipy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: matplotlib
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: pyarrow
        update-types: ["version-update:semver-major"]
      # O cliente do MLflow fala DIRETO com o Postgres de tracking (URI postgresql+psycopg2).
      # Um cliente 3.x contra o banco 2.13 tenta migrar o schema na primeira conexao. Subir
      # de major e tarefa planejada (servidor e cliente juntos), nao PR de dependencia.
      # A PR #273 do Dependabot (2.13.2 -> 3.16.0) foi fechada por isso em 14/09/2026.
      # Minor também fica: requirements-dev.txt pina 2.13.2 (o mesmo do /V2/api), e o
      # mlflow 2.22 puxa gunicorn<24, que conflita com o gunicorn da API.
      - dependency-name: mlflow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencias"]
    commit-message:
      prefix: "deps(dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencias"]
    commit-message:
      prefix: "deps(actions)"
