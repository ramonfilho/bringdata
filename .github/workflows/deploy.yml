# Deploy: push na main -> suíte -> canary a 0% -> progressão 10 / 50 / 100 dentro da janela.
#
# O motor é o mesmo de antes, V2/api/deploy-gate.sh (lock no GCS, frescor, monotonicidade,
# ledger, lockstep dos espelhos) envelopando o deploy_capi.sh (build, revisão sem tráfego,
# Gates B, C e D). O que muda é QUEM chama: o runner, com a identidade federada da conta
# github-deployer (scripts/bootstrap_identidade_ci.sh), em vez de um laptop com .env.
#
# Jobs:
#   test        - reaproveita o ci.yml (lint + pytest). Canary só nasce se passar.
#   canary      - build da imagem a partir do SHA do push, revisão a 0% com tag canary-*,
#                 Gates B (smoke), D (YAML dentro da imagem), C (replay de 50 leads contra a
#                 revisão viva) e o progression_gate em modo check 0 -> 10.
#   vigia       - 60 minutos depois dos 100%: a cada 5 min colhe feature-report da revisão e
#                 taxa de 5xx dos logs dela; ERROR ou 5xx > 1% (com amostra) devolvem 100% à
#                 revisão anterior sozinho (scripts/vigia_pos_deploy.py).
#   canary-10, canary-50, production
#               - sem clique humano desde 17/09/2026: cada degrau consulta o progression_gate
#                 (exit 0 = PROMOTE; 1 = HOLD, o job falha e pode ser reexecutado mais tarde
#                 sem novo deploy; 2 = ROLLBACK) e promove pelo deploy-gate, que em 100%
#                 alinha os espelhos monitoring e webhook. Os environments continuam
#                 existindo pelo registro de deployments, sem required reviewers.
#   janela      - antes do primeiro tráfego (canary-10), scripts/janela_de_deploy.py responde
#                 "é hora?": dia útil, 09h às 18h em São Paulo (o carrinho aberto deixou de
#                 fechar a janela em 18/09/2026). Fechada: o canário fica a 0%, o run termina verde e
#                 um marcador (gs://smart-ads-mlflow/deploy-gate/aguardando_janela.json)
#                 guarda a revisão e o alvo de rollback.
#   retomar     - no cron de 09:05 (dias úteis) ou por workflow_dispatch modo=retomar: lê o
#                 marcador (ou revisao_alvo), confere que a revisão existe e é mais nova que
#                 a viva, e a escada 10 / 50 / 100 + vigia segue a partir dela.
#
# Trava de segurança da promoção: os jobs de tráfego só rodam com a variável
# PROMOTION_ENABLED igual a "true". Desligá-la faz todo canário parar a 0%.
#
# workflow_dispatch com modo=wif-check: só prova a identidade (token, bucket, segredo),
# não toca produção. Use uma vez depois do bootstrap.
#
# Rollback (desde 14/09/2026):
#   automático - cada degrau roda scripts/promover_com_rollback.sh: gate, promote, smoke
#                depois do tráfego. Gate=ROLLBACK, promote quebrado ou smoke ruim devolvem
#                100% à revisão que estava viva antes do canário, sozinhos.
#   manual     - workflow_dispatch com modo=rollback e revisao_alvo: devolve 100% àquela
#                revisão pelo deploy-gate (com --rollback, que libera a monotonicidade) e
#                alinha os espelhos. É o botão de emergência, sem esperar environment.
name: Deploy

on:
  push:
    branches: [main]
    # Só o que entra na imagem deploya. Documento, teste, workflow e infra não criam canário.
    paths-ignore:
      - '**.md'
      - 'V2/docs/**'
      - 'V2/tests/**'
      - 'V2/requirements-dev.txt'
      - 'V2/.coveragerc'
      - '.github/**'
      - '.claude/**'
      - 'scripts/**'
      - 'infra/**'
  schedule:
    # 09:05 em São Paulo (UTC-3, sem horário de verão), de segunda a sexta: retoma um
    # canário que ficou esperando a janela. Sem marcador, o run termina em segundos.
    - cron: '5 12 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: "canary (fluxo normal), retomar (escada a partir de revisao_alvo ou do marcador), wif-check (só testa a identidade) ou rollback (devolve 100% a uma revisão)"
        type: choice
        default: canary
        options: [canary, retomar, wif-check, rollback]
      revisao_alvo:
        description: "modo=rollback: revisão que volta a 100%; modo=retomar: canário a 0% que sobe a escada (vazio = ler o marcador)"
        type: string
        required: false

concurrency:
  group: deploy-prod          # um deploy por vez; o seguinte espera (não cancela)
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: smart-ads-451319
  REGION: us-central1
  SERVICE: smart-ads-api
  # scripts/gcp_auth.py: token de identidade personificando a própria conta do runner
  GCP_IMPERSONATE_SA: ${{ vars.GCP_DEPLOYER_SA }}

jobs:
  rollback:
    name: rollback manual (revisao_alvo volta a 100%)
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: revisao_alvo obrigatória
        run: test -n "${{ inputs.revisao_alvo }}" || { echo "informe revisao_alvo"; exit 1; }
      - name: deploy-gate promote --rollback (100% + lockstep dos espelhos)
        run: bash V2/api/deploy-gate.sh promote --revision "${{ inputs.revisao_alvo }}" --to 100 --rollback --yes
      - name: smoke na revisão restaurada
        run: python3 V2/scripts/smoke_test_revision.py "${{ inputs.revisao_alvo }}"

  wif-check:
    name: identidade federada (só leitura)
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'wif-check'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: o que o pipeline precisa conseguir fazer
        run: |
          set -e
          echo "conta ativa: $(gcloud config get-value account)"
          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')
          echo "serviço: $URL"
          gcloud auth print-identity-token --audiences="$URL" >/dev/null && echo "token de identidade: ok"
          gcloud storage ls "gs://smart-ads-mlflow/deploy-gate/" >/dev/null && echo "bucket do gate: ok"
          gcloud secrets versions access latest --secret=railway-db-password --project="$PROJECT_ID" >/dev/null && echo "segredo railway-db-password: ok"
          gcloud artifacts docker images list gcr.io/$PROJECT_ID/$SERVICE --limit=1 >/dev/null && echo "registro de imagens: ok"

  test:
    if: github.event_name == 'push' || inputs.modo == 'canary'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  canary:
    name: canary a 0% (build + gates)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.rev.outputs.revision }}
      previous: ${{ steps.rev.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # o gate compara HEAD com origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: V2/requirements-dev.txt
      - run: pip install -r V2/requirements-dev.txt
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v3
      - run: gcloud auth configure-docker gcr.io --quiet

      - name: revisão viva antes do deploy (alvo de rollback)
        id: before
        shell: bash   # pipefail: gcloud falhando não pode virar alvo de rollback vazio
        run: |
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['revisionName'] for t in d['status']['traffic'] if t.get('percent')==100))" \
            | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/previous=/' >> "$GITHUB_OUTPUT"

      - name: deploy-gate deploy (canary 0% + Gates B, D, C + check 0 -> 10)
        run: bash V2/api/deploy-gate.sh deploy --yes

      - name: revisão canary criada
        id: rev
        run: |
          REV=$(gcloud run revisions list --service="$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(metadata.name)' --limit=1)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "previous=${{ steps.before.outputs.previous }}" >> "$GITHUB_OUTPUT"
          echo "canary: $REV (viva: ${{ steps.before.outputs.previous }})" >> "$GITHUB_STEP_SUMMARY"

      - name: imagem de treino (etapa treino do Dockerfile, mesma tag da API)
        # Reaproveita as camadas que o build da API acabou de deixar no runner; só
        # acrescenta mlflow e pyarrow. Não segura o deploy da API se falhar: o job de
        # retreino continua na imagem anterior e o resumo do run mostra o problema.
        continue-on-error: true
        run: |
          # A revisão devolve a imagem por digest (@sha256:...); o template do serviço
          # guarda a forma com tag (:vAAAAMMDD_HHMMSS), que é a que o job de retreino usa.
          API_IMG=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(spec.template.spec.containers[0].image)')
          TAG="${API_IMG##*:}"
          case "$TAG" in v[0-9]*) ;; *) echo "tag inesperada: $API_IMG"; exit 1;; esac
          IMG="gcr.io/$PROJECT_ID/smart-ads-treino:$TAG"
          mkdir -p V2/mlruns_build
          docker buildx build --load --target treino -f V2/api/Dockerfile \
            --build-arg MODEL_PATH=mlruns_build \
            --build-arg APP_COMMIT="$(git rev-parse --short HEAD)" --build-arg APP_COMMIT_DIRTY=false \
            -t "$IMG" V2/
          docker push "$IMG"
          echo "imagem de treino: $IMG" >> "$GITHUB_STEP_SUMMARY"
          # O job de retreino segue a imagem da API (lockstep): o cron do dia 1 e o gatilho
          # de drift precisam do código de pós-treino do deploy vigente.
          if gcloud run jobs update retreino-mensal --image="$IMG" --region="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "job retreino-mensal na imagem $IMG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "job retreino-mensal NÃO atualizado (ainda não existe? scripts/setup_retreino_job.sh)" >> "$GITHUB_STEP_SUMMARY"
          fi

  retomar:
    name: retomar canário que esperava a janela
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'retomar')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.alvo.outputs.revision }}
      previous: ${{ steps.alvo.outputs.previous }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: marcador (ou revisao_alvo) -> revisão que sobe e alvo de rollback
        id: alvo
        env:
          MARCADOR: gs://smart-ads-mlflow/deploy-gate/aguardando_janela.json
          ALVO_INPUT: ${{ inputs.revisao_alvo }}
        run: |
          set -e
          REV="$ALVO_INPUT"
          if [ -z "$REV" ]; then
            REV=$(gcloud storage cat "$MARCADOR" --project="$PROJECT_ID" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('revision',''))" 2>/dev/null || true)
          fi
          if [ -z "$REV" ]; then echo "nada aguardando a janela." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          VIVA=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['revisionName'] for t in d['status']['traffic'] if t.get('percent')==100))")
          num(){ echo "$1" | sed -E 's/.*-0*([0-9]+)-[a-z0-9]+$/\1/'; }
          if ! gcloud run revisions describe "$REV" --region="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "revisão $REV não existe mais; marcador descartado." | tee -a "$GITHUB_STEP_SUMMARY"
            gcloud storage rm "$MARCADOR" --project="$PROJECT_ID" >/dev/null 2>&1 || true
            exit 0
          fi
          if [ "$(num "$REV")" -le "$(num "$VIVA")" ]; then
            echo "$REV não é mais nova que a viva ($VIVA); marcador descartado." | tee -a "$GITHUB_STEP_SUMMARY"
            gcloud storage rm "$MARCADOR" --project="$PROJECT_ID" >/dev/null 2>&1 || true
            exit 0
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "previous=$VIVA" >> "$GITHUB_OUTPUT"
          echo "retomando $REV (viva: $VIVA)" >> "$GITHUB_STEP_SUMMARY"

  canary-10:
    name: promover a 10%
    needs: [canary, retomar]
    if: ${{ !cancelled() && vars.PROMOTION_ENABLED == 'true' && (needs.canary.result == 'success' || needs.retomar.outputs.revision != '') }}
    environment: canary-10
    runs-on: ubuntu-latest
    env:
      REVISAO: ${{ needs.canary.outputs.revision || needs.retomar.outputs.revision }}
      ANTERIOR: ${{ needs.canary.outputs.previous || needs.retomar.outputs.previous }}
      MARCADOR: gs://smart-ads-mlflow/deploy-gate/aguardando_janela.json
    outputs:
      adiado: ${{ steps.janela.outputs.aberta == 'false' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: é hora? (dia útil, 09h às 18h em São Paulo)
        id: janela
        run: python3 V2/scripts/janela_de_deploy.py
      - name: janela fechada; o canário fica a 0% e o marcador guarda o que retomar
        if: steps.janela.outputs.aberta == 'false'
        env:
          MOTIVO: ${{ steps.janela.outputs.motivo }}
          PROXIMA: ${{ steps.janela.outputs.proxima }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -c "import json,os,datetime; print(json.dumps({'revision': os.environ['REVISAO'], 'previous': os.environ['ANTERIOR'], 'sha': os.environ['SHA'], 'run': os.environ['RUN_ID'], 'motivo': os.environ['MOTIVO'], 'ts': datetime.datetime.now(datetime.timezone.utc).isoformat()}))" \
            | gcloud storage cp - "$MARCADOR" --project="$PROJECT_ID"
          echo "janela fechada ($MOTIVO). $REVISAO fica a 0%; retoma em $PROXIMA pelo cron, ou antes com workflow_dispatch modo=retomar." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: gate 0 -> 10, promote a 10%, smoke; rollback automático se der ruim
        if: steps.janela.outputs.aberta == 'true'
        run: |
          gcloud storage rm "$MARCADOR" --project="$PROJECT_ID" >/dev/null 2>&1 || true
          bash V2/scripts/promover_com_rollback.sh "$REVISAO" "$ANTERIOR" 0 10

  canary-50:
    name: promover a 50%
    needs: [canary, retomar, canary-10]
    if: ${{ !cancelled() && vars.PROMOTION_ENABLED == 'true' && needs.canary-10.result == 'success' && needs.canary-10.outputs.adiado != 'true' }}
    environment: canary-50
    runs-on: ubuntu-latest
    env:
      REVISAO: ${{ needs.canary.outputs.revision || needs.retomar.outputs.revision }}
      ANTERIOR: ${{ needs.canary.outputs.previous || needs.retomar.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: gate 10 -> 50, promote a 50%, smoke; rollback automático se der ruim
        run: bash V2/scripts/promover_com_rollback.sh "$REVISAO" "$ANTERIOR" 10 50

  production:
    name: promover a 100% (+ lockstep dos espelhos)
    needs: [canary, retomar, canary-50]
    if: ${{ !cancelled() && vars.PROMOTION_ENABLED == 'true' && needs.canary-50.result == 'success' }}
    environment: production
    runs-on: ubuntu-latest
    env:
      REVISAO: ${{ needs.canary.outputs.revision || needs.retomar.outputs.revision }}
      ANTERIOR: ${{ needs.canary.outputs.previous || needs.retomar.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: gate 50 -> 100, promote a 100%, smoke; rollback automático se der ruim
        run: bash V2/scripts/promover_com_rollback.sh "$REVISAO" "$ANTERIOR" 50 100

  vigia:
    name: vigia 60 min depois dos 100% (rollback automático)
    needs: [canary, retomar, production]
    if: ${{ !cancelled() && vars.PROMOTION_ENABLED == 'true' && needs.production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REVISAO: ${{ needs.canary.outputs.revision || needs.retomar.outputs.revision }}
      ANTERIOR: ${{ needs.canary.outputs.previous || needs.retomar.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: feature-report da revisão + 5xx dos logs, a cada 5 min por 60 min
        run: python3 V2/scripts/vigia_pos_deploy.py --revision "$REVISAO" --rollback "$ANTERIOR" --minutos 60 --intervalo 5
